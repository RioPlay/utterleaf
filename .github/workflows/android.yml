name: Android voice preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Build, unit tests, and lint
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Prepare reviewed inference fixtures (test APK only)
        run: |
          mkdir -p app/src/androidTest/assets
          curl --fail --location --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin -o app/src/androidTest/assets/ggml-tiny.en.bin
          echo '921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  app/src/androidTest/assets/ggml-tiny.en.bin' | sha256sum --check
          curl --fail --location --retry 3 https://raw.githubusercontent.com/ggml-org/whisper.cpp/2eeeba56e9edd762b4b38467bab96c2517163158/samples/jfk.wav -o app/src/androidTest/assets/jfk.wav
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator inference and privacy checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd mobile/android && bash gradlew --no-daemon connectedDebugAndroidTest
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n org.utterleaf.voice/.SetupActivity
            sleep 3
            adb exec-out screencap -p > mobile/android/app/build/reports/setup-emulator.png
      - name: Checksums
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/Utterleaf-Voice-0.1.0-alpha01-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk preview/Utterleaf-Voice-0.1.0-alpha01-unsigned.apk
          cd preview && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-voice-preview
          path: |
            mobile/android/preview/
            mobile/android/app/build/reports/

name: Android LatinIME foundation
on:
  workflow_dispatch:
  pull_request:
    # Markdown notices are APK inputs and must trigger verification too.
    paths: ['mobile/latinime/**', '.github/workflows/android-foundation.yml']
  push:
    branches: [main]
    paths: ['mobile/latinime/**', '.github/workflows/android-foundation.yml']
permissions:
  contents: read
concurrency:
  group: android-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/latinime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Compile, unit tests and lint
        run: bash gradlew --no-daemon -PincludeRecoveryHost=true :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:assembleRelease :recoveryHost:assembleDebug :recoveryHost:lintDebug
      - name: Verify packaged notices against source
        run: python3 tools/verify_packaged_notices.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real IME and security regressions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >
            cd mobile/latinime &&
            adb shell settings put secure show_ime_with_hard_keyboard 1 &&
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton &&
            adb shell wm size && adb shell wm density &&
            bash gradlew --no-daemon :app:connectedDebugAndroidTest &&
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk &&
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk &&
            adb install -r -t recoveryHost/build/outputs/apk/debug/recoveryHost-debug.apk &&
            python3 tools/ime_process_recovery_probe.py --adb adb --serial emulator-5554
            --logs app/build/reports/ime-process-recovery &&
            python3 tools/dictionary_storage_crash_probe.py --adb adb --serial emulator-5554
            --logs app/build/reports/dictionary-storage-crash
      # CI publishes reports only; signed experimental downloads are separately verified.
      - name: Preserve verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Android-foundation-reports
          path: |
            mobile/latinime/app/build/reports/
            mobile/latinime/app/build/outputs/androidTest-results/
            mobile/latinime/recoveryHost/build/reports/
          retention-days: 14

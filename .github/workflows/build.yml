name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]" pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Build CPU distribution and collect notices
        run: .\packaging\build.ps1
      - name: Frozen CLI smoke test
        run: .\dist\Utterleaf\utterleaf-cli.exe --help
      - name: Device report (host hardware may be unavailable)
        run: .\dist\Utterleaf\utterleaf-cli.exe --doctor
        continue-on-error: true
      - name: Package
        run: Compress-Archive -Path dist\Utterleaf -DestinationPath dist\Utterleaf-windows-x64-cpu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Utterleaf-windows-x64-cpu
          path: dist/Utterleaf-windows-x64-cpu.zip
  linux-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python, Tk, audio and X11 test tools
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y python3-venv python3-tk libportaudio2 xvfb xauth xclip xdotool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install
        run: |
          /usr/bin/python3 -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/bin/python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test with a virtual X11 display
        run: xvfb-run -a ./.venv/bin/python -m pytest -q -ra
      - name: CLI smoke test
        run: ./.venv/bin/python -m utterleaf --help

  macos-tests:
    runs-on: macos-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Python with matching Tk and PortAudio
        run: |
          brew install python@3.14 python-tk@3.14 portaudio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonPrefix = brew --prefix python@3.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pythonPrefix/bin/python3.14" -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install
        run: ./.venv/bin/python -m pip install -e ".[dev]"
      - name: Test
        run: ./.venv/bin/python -m pytest -q -ra
      - name: CLI smoke test
        run: ./.venv/bin/python -m utterleaf --help

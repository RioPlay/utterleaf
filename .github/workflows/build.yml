name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - 'mobile/**'
      - 'docs/mobile*.md'
      - 'docs/android*.md'
      - 'docs/android-next/**'
      - 'docs/plans/active/android*.md'
      - 'docs/plans/completed/android*.md'
      - 'docs/workspaces.md'
      - '.github/workflows/android*.yml'
  pull_request:
    paths-ignore:
      - 'mobile/**'
      - 'docs/mobile*.md'
      - 'docs/android*.md'
      - 'docs/android-next/**'
      - 'docs/plans/active/android*.md'
      - 'docs/plans/completed/android*.md'
      - 'docs/workspaces.md'
      - '.github/workflows/android*.yml'
permissions:
  contents: read

jobs:
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows Python, Tk, and audio tools
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install Linux Python, Tk, and X11 tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y python3-venv python3-tk libportaudio2 xvfb xauth xclip xdotool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create virtual environment and install
        run: |
          if ($IsWindows) { python -m venv .venv; $py = '.\.venv\Scripts\python.exe' }
          else { /usr/bin/python3 -m venv .venv; $py = './.venv/bin/python' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install --constraint packaging/constraints-posix.txt -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fast security, capture, delivery, and settings behavior
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m pytest tests/test_repo_boundaries.py tests/test_privacy.py tests/test_config.py tests/test_audio.py tests/test_capture_store.py tests/test_continuous_capture.py tests/test_inject.py tests/test_edit_target.py tests/test_delivery_cancellation.py tests/test_settings.py tests/test_settings_controller.py tests/test_settings_instance.py tests/test_settings_search.py -m "not slow and not integration" -q
      - name: Documented Settings UI smoke
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe tests/capture_settings.py
      - name: Linux Wayland session subset on X11
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: wayland
        run: xvfb-run -a ./.venv/bin/python -m pytest tests/test_hotkey.py tests/test_host.py tests/test_window_activation.py -q

  full-suite:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.14.7"
          - os: ubuntu-24.04
            python: system
          - os: macos-latest
            python: "3.14.7"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and Linux Tk/audio/X11 tools
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y python3-venv python3-tk libportaudio2 xvfb xauth xclip xdotool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install matching macOS Tk and PortAudio
        if: runner.os == 'macOS'
        run: |
          brew install python@3.14 python-tk@3.14 portaudio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonPrefix = brew --prefix python@3.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pythonPrefix/bin/python3.14" -m venv .venv
      - name: Install Python dependencies
        run: |
          if ($IsWindows) { python -m venv .venv; $py = '.\.venv\Scripts\python.exe' }
          elseif ($IsLinux) { /usr/bin/python3 -m venv .venv; $py = './.venv/bin/python' }
          elseif ($IsMacOS) { $py = './.venv/bin/python' }
          else { python -m venv .venv; $py = './.venv/bin/python' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            & $py -m pip install --require-hashes -r packaging\\requirements-windows-preview.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $py -m pip install --no-deps --no-build-isolation -e ".[dev]"
          } else {
            & $py -m pip install --constraint packaging/constraints-posix.txt -e ".[dev]"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full desktop suite
        run: |
          if ($IsWindows) { .\.venv\Scripts\python.exe -m pytest -q }
          elseif ($IsLinux) { xvfb-run -a ./.venv/bin/python -m pytest -q -ra }
          else { ./.venv/bin/python -m pytest -q -ra -o faulthandler_timeout=120 }

  installers:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows Python and build tools
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install macOS Python, Tk, and PortAudio
        if: runner.os == 'macOS'
        run: |
          brew install python@3.14 python-tk@3.14 portaudio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonPrefix = brew --prefix python@3.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pythonPrefix/bin/python3.14" -m venv .venv
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y python3-venv python3-tk libportaudio2 xvfb xauth xclip xdotool python3-gi gir1.2-ayatanaappindicator3-0.1
      - name: Install dependencies
        run: |
          if ($IsWindows) { python -m venv .venv; $py = '.\.venv\Scripts\python.exe' }
          elseif ($IsLinux) { /usr/bin/python3 -m venv --system-site-packages .venv; $py = './.venv/bin/python' }
          elseif ($IsMacOS) { $py = './.venv/bin/python' }
          else { python -m venv .venv; $py = './.venv/bin/python' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            & $py -m pip install --require-hashes -r packaging\\requirements-windows-preview.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $py -m pip install --no-deps --no-build-isolation -e .
          } elseif ($IsMacOS) {
            & $py -m pip install --constraint packaging/constraints-posix.txt -e . pyinstaller
          } else {
            & $py -m pip install --constraint packaging/constraints-posix.txt -e . pyinstaller
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows CPU distribution
        if: runner.os == 'Windows'
        run: .\packaging\build.ps1
      - name: Test and archive Windows distribution
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\python.exe tests\smoke_release.py dist\Utterleaf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\Utterleaf -DestinationPath dist\Utterleaf-windows-x64-cpu.zip
          Copy-Item dist\Utterleaf\SHA256SUMS.txt dist\SHA256SUMS.txt
      - name: Build and archive macOS distribution
        if: runner.os == 'macOS'
        run: |
          ./.venv/bin/python -m PyInstaller --noconfirm --clean packaging/utterleaf.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/bin/python packaging/collect_notices.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -czf dist/Utterleaf-macos-arm64.tar.gz -C dist Utterleaf
      - name: Build and archive Linux distribution
        if: runner.os == 'Linux'
        run: |
          ./.venv/bin/python -m PyInstaller --noconfirm --clean packaging/utterleaf.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/bin/python packaging/collect_notices.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -czf dist/Utterleaf-linux-x64.tar.gz -C dist Utterleaf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/bin/python -m utterleaf --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Utterleaf-${{ runner.os }}
          path: dist/

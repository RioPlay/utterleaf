name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]" pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Build CPU distribution and collect notices
        run: .\packaging\build.ps1
      - name: Frozen CLI smoke test
        run: .\dist\Utterleaf\utterleaf-cli.exe --help
      - name: Device report (host hardware may be unavailable)
        run: .\dist\Utterleaf\utterleaf-cli.exe --doctor
        continue-on-error: true
      - name: Package
        run: |
          Compress-Archive -Path dist\Utterleaf -DestinationPath dist\Utterleaf-windows-x64-cpu.zip
          Copy-Item dist\Utterleaf\SHA256SUMS.txt dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Utterleaf-windows-x64-cpu
          path: |
            dist/Utterleaf-windows-x64-cpu.zip
            dist/SHA256SUMS.txt
  linux-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python, Tk, audio and X11 test tools
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y python3-venv python3-tk libportaudio2 xvfb xauth xclip xdotool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install
        run: |
          /usr/bin/python3 -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/bin/python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test with a virtual X11 display
        run: xvfb-run -a ./.venv/bin/python -m pytest -q -ra
      - name: CLI smoke test
        run: ./.venv/bin/python -m utterleaf --help

  macos-tests:
    runs-on: macos-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Python with matching Tk and PortAudio
        run: |
          brew install python@3.14 python-tk@3.14 portaudio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonPrefix = brew --prefix python@3.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pythonPrefix/bin/python3.14" -m venv .venv
      - name: Install
        run: ./.venv/bin/python -m pip install -e ".[dev]"
      - name: Test
        run: ./.venv/bin/python -m pytest -q -ra
      - name: CLI smoke test
        run: ./.venv/bin/python -m utterleaf --help

  macos-build:
    runs-on: macos-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Python with matching Tk and PortAudio
        run: |
          brew install python@3.14 python-tk@3.14 portaudio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonPrefix = brew --prefix python@3.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pythonPrefix/bin/python3.14" -m venv .venv
      - name: Install
        run: ./.venv/bin/python -m pip install -e . pyinstaller
      - name: Build
        run: ./.venv/bin/python -m PyInstaller --noconfirm --clean packaging/utterleaf.spec
      - name: CLI smoke test
        run: ./dist/Utterleaf/utterleaf --help
      - name: Package
        run: tar -czf dist/Utterleaf-macos-arm64.tar.gz -C dist Utterleaf
      - uses: actions/upload-artifact@v4
        with:
          name: Utterleaf-macos-arm64
          path: dist/Utterleaf-macos-arm64.tar.gz

  linux-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python, Tk and audio libraries
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y python3-venv python3-tk libportaudio2 xvfb xauth xclip xdotool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install
        run: |
          /usr/bin/python3 -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/bin/python -m pip install -e . pyinstaller
      - name: Build
        run: ./.venv/bin/python -m PyInstaller --noconfirm --clean packaging/utterleaf.spec
      - name: CLI smoke test
        run: ./dist/Utterleaf/utterleaf --help
      - name: Package
        run: tar -czf dist/Utterleaf-linux-x64.tar.gz -C dist Utterleaf
      - name: Test extracted Linux release startup and Wayland session controls
        run: |
          New-Item -ItemType Directory -Path extracted-release
          tar -xzf dist/Utterleaf-linux-x64.tar.gz -C extracted-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xvfb-run -a ./.venv/bin/python tests/smoke_linux_release.py extracted-release/Utterleaf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Utterleaf-linux-x64
          path: dist/Utterleaf-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos-build, linux-build, macos-tests, linux-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksum the archives
        run: |
          cd dist
          for f in *.zip *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Utterleaf $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md

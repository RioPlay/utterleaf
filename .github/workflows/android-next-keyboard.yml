name: Android next keyboard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/next-keyboard/**'
      - '.github/workflows/android-next-keyboard.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/next-keyboard/**'
      - '.github/workflows/android-next-keyboard.yml'

permissions:
  contents: read

concurrency:
  group: android-next-keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/next-keyboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36 build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify Gradle 8.13 toolchain
        run: bash gradlew --version | grep -F 'Gradle 8.13'
      - name: Unit tests, lint and unsigned release assembly
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin :app:assembleRelease
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: IME instrumentation regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd mobile/next-keyboard && bash tools/run-emulator-tests.sh
      # Reports only: this workflow never signs, publishes, or uploads APKs.
      - name: Preserve verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-next-keyboard-reports
          path: |
            mobile/next-keyboard/app/build/reports/
            mobile/next-keyboard/app/build/outputs/androidTest-results/
          retention-days: 14

name: Windows desktop preview

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop preview tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PREVIEW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      UTTERLEAF_BUNDLE_CUDA: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.PREVIEW_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-windows-preview.txt

      - name: Verify preview tag, revision, and version
        run: |
          $pattern = '^desktop-v(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)-rc\.(?<rc>[1-9][0-9]*)$'
          if ($env:PREVIEW_TAG -notmatch $pattern) {
              Write-Error 'Preview tag must use desktop-vMAJOR.MINOR.PATCH-rc.NUMBER.'
          }
          $expectedVersion = "$($Matches.major).$($Matches.minor).$($Matches.patch)rc$($Matches.rc)"
          $tagRevision = git rev-parse "refs/tags/$env:PREVIEW_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $headRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tagRevision -ne $headRevision) {
              Write-Error 'Checked-out revision does not match the requested preview tag.'
          }
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $moduleVersion = python -c "import ast; tree=ast.parse(open('utterleaf/__init__.py', encoding='utf-8').read()); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets)))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($projectVersion -ne $expectedVersion -or $moduleVersion -ne $expectedVersion) {
              Write-Error 'Preview tag, project version, and module version do not match.'
          }

      - name: Install exact build and test environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r packaging\requirements-windows-preview.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full desktop tests
        run: |
          New-Item -ItemType Directory -Path 'preview-evidence' | Out-Null
          .\.venv\Scripts\python.exe -c "import subprocess,sys; from pathlib import Path; p=subprocess.run([sys.executable,'-m','pytest','-q','-ra','--junitxml=preview-evidence/pytest.xml'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,encoding='utf-8',errors='replace'); Path('preview-evidence/pytest.txt').write_text(p.stdout,encoding='utf-8'); print(p.stdout,end=''); raise SystemExit(p.returncode)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build canonical CPU distribution
        run: .\packaging\build.ps1

      - name: Verify frozen CLI help
        run: .\dist\Utterleaf\utterleaf-cli.exe --help

      - name: Verify frozen formatting and invalid worker request
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'utterleaf-preview-smoke'
          $text = .\dist\Utterleaf\utterleaf-cli.exe --polish 'hello period next sentence period' --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($text.Trim() -ne 'Hello. Next sentence.') { Write-Error 'Frozen punctuation formatting failed.' }
          .\.venv\Scripts\python.exe -c "import json,subprocess; p=subprocess.run([r'dist\Utterleaf\utterleaf-cli.exe','--clipboard-worker'],input='',capture_output=True,text=True,timeout=10); assert p.returncode==2; assert json.loads(p.stdout)=={'v':1,'status':'unavailable'}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run frozen diagnostics
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'utterleaf-preview-smoke'
          $doctorJson = .\.venv\Scripts\python.exe -c "import json,subprocess; p=subprocess.run([r'dist\Utterleaf\utterleaf-cli.exe','--doctor','--offline'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,encoding='utf-8',errors='replace',timeout=45); print(json.dumps({'exit':p.returncode,'lines':p.stdout.splitlines()}))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $doctorResult = $doctorJson | ConvertFrom-Json
          $lines = @($doctorResult.lines)
          $doctorExit = [int]$doctorResult.exit
          $lines | Write-Output
          if ($doctorExit -eq 0) {
              "DOCTOR_STATUS=passed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
          }
          $microphone = [Array]::IndexOf($lines, 'microphones:')
          $failures = @($lines | Where-Object { $_ -match '^  FAIL \(' })
          $knownUnavailable = $failures.Count -eq 1 -and $microphone -ge 0 -and (
              $failures[0] -match '(?i)(PortAudio|Error (querying|initializing)|audio device|host error)'
          )
          if (-not $knownUnavailable) {
              Write-Error "Frozen diagnostics failed unexpectedly with exit code $doctorExit."
          }
          Write-Warning 'The hosted runner has no usable audio host/device; frozen diagnostics otherwise started normally.'
          "DOCTOR_STATUS=unsupported-host-audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record build identity and dependencies
        run: |
          $bundle = 'dist\Utterleaf'
          New-Item -ItemType Directory -Path (Join-Path $bundle 'packaging') -Force | Out-Null
          Copy-Item -LiteralPath 'packaging\preview-notes.md' -Destination (Join-Path $bundle 'packaging\preview-notes.md')
          Copy-Item -LiteralPath 'packaging\requirements-windows-preview.txt' -Destination (Join-Path $bundle 'packaging\requirements-windows-preview.txt')
          $dependencies = Join-Path $bundle 'DEPENDENCIES.txt'
          .\.venv\Scripts\python.exe -c "import importlib.metadata as m; rows=sorted({((d.metadata.get('Name') or d.name), d.version) for d in m.distributions()}, key=lambda x:x[0].lower()); print('\n'.join(f'{n}=={v}' for n,v in rows))" | Set-Content -LiteralPath $dependencies -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dependencyHash = (Get-FileHash -LiteralPath $dependencies -Algorithm SHA256).Hash.ToLowerInvariant()
          $requirementsHash = (Get-FileHash -LiteralPath 'packaging\requirements-windows-preview.txt' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
              schema_version = 1
              artifact = 'Utterleaf-windows-x64-cpu.zip'
              preview_tag = $env:PREVIEW_TAG
              project_version = .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
              source_revision = git rev-parse HEAD
              python_version = .\.venv\Scripts\python.exe -c "import platform; print(platform.python_version())"
              pyinstaller_version = .\.venv\Scripts\pyinstaller.exe --version
              runner_image = $env:ImageVersion
              cpu_only = $true
              doctor_status = $env:DOCTOR_STATUS
              dependencies_sha256 = $dependencyHash
              requirements_sha256 = $requirementsHash
              built_utc = [DateTime]::UtcNow.ToString('o')
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $bundle 'BUILD-MANIFEST.json') -Encoding utf8
          Copy-Item -LiteralPath (Join-Path $bundle 'BUILD-MANIFEST.json') -Destination 'dist\BUILD-MANIFEST.json'
          Copy-Item -LiteralPath $dependencies -Destination 'dist\DEPENDENCIES.txt'

      - name: Archive and verify preview artifact
        run: |
          $archive = 'dist\Utterleaf-windows-x64-cpu.zip'
          Compress-Archive -Path 'dist\Utterleaf' -DestinationPath $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -c "import zipfile; z=zipfile.ZipFile(r'dist\Utterleaf-windows-x64-cpu.zip'); names=[n.replace(chr(92),'/') for n in z.namelist()]; required={'Utterleaf/utterleaf.exe','Utterleaf/utterleafw.exe','Utterleaf/utterleaf-cli.exe','Utterleaf/THIRD-PARTY-NOTICES.md','Utterleaf/SHA256SUMS.txt','Utterleaf/BUILD-MANIFEST.json','Utterleaf/DEPENDENCIES.txt','Utterleaf/packaging/preview-notes.md','Utterleaf/packaging/requirements-windows-preview.txt'}; assert required <= set(names), sorted(required-set(names)); assert z.testzip() is None; import hashlib; rows=[line.split() for line in z.read('Utterleaf/SHA256SUMS.txt').decode('ascii').splitlines() if line.strip()]; assert len(rows)==3; assert {name for digest,name in rows}=={'utterleaf.exe','utterleafw.exe','utterleaf-cli.exe'}; assert all(hashlib.sha256(z.read('Utterleaf/'+name)).hexdigest()==digest for digest,name in rows)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Utterleaf-windows-x64-cpu.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-desktop-preview
          path: |
            dist/Utterleaf-windows-x64-cpu.zip
            dist/Utterleaf-windows-x64-cpu.zip.sha256
            dist/BUILD-MANIFEST.json
            dist/DEPENDENCIES.txt
            packaging/requirements-windows-preview.txt
            preview-evidence/pytest.txt
            preview-evidence/pytest.xml
          if-no-files-found: error
          retention-days: 30

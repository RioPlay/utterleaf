version: 2
updates:
  # Dependabot requires a schedule, but 0 disables version-update PRs.
  # Security updates remain enabled when repository security updates are on.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /packaging
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

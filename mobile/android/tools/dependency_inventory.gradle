import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Opt-in inventory: resolve graphs, never execute application/native code.
gradle.projectsEvaluated {
    rootProject.tasks.register('securityDependencyInventory') {
        doLast {
            def rows = []
            def scopes = []
            rootProject.allprojects.each { project ->
                [project.configurations, project.buildscript.configurations].each { configurations ->
                    configurations.findAll { it.canBeResolved }.each { configuration ->
                        scopes.add("${project.path}:${configuration.name}".toString())
                        def result = configuration.incoming.resolutionResult
                        result.allDependencies.each { dependency ->
                            if (dependency instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                                throw new GradleException("Unresolved ${project.path}:${configuration.name}: ${dependency.attempted}", dependency.failure)
                            }
                        }
                        result.allComponents.each { component ->
                            if (component.id instanceof ModuleComponentIdentifier) {
                                rows.add([name: "${component.id.group}:${component.id.module}".toString(),
                                    version: component.id.version,
                                    configuration: "${project.path}:${configuration.name}".toString()])
                            }
                        }
                    }
                }
            }
            if (rows.empty) throw new GradleException('No resolved Maven dependencies')
            def output = new File(rootProject.projectDir, 'build/reports/security/dependencies.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                gradleVersion: gradle.gradleVersion,
                configurations: scopes.unique().sort(),
                dependencies: rows.unique().sort { a, b -> a.toString() <=> b.toString() }
            ]))
            println "Security inventory: ${rows.size()} components -> ${output}"
        }
    }
}
